<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Fluent Light Outer Squircle Surface -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>

    <!-- Left Pane Gradient (Cobalt Blue) -->
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>

    <!-- Right Pane Gradient (Sky Indigo) -->
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Central Bidirectional Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0969da" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <filter id="outerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0969da" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Outer Fluent Light Squircle -->
  <rect x="64" y="64" width="896" height="896" rx="210" ry="210"
        fill="url(#bgGrad)" stroke="#bfdbfe" stroke-width="10" filter="url(#outerShadow)" />

  <!-- Left Comparison Document Pane (Cobalt) -->
  <g id="leftPane">
    <rect x="164" y="204" width="310" height="616" rx="42"
          fill="url(#leftGrad)" stroke="#0969da" stroke-width="18" />
    <line x1="214" y1="296" x2="364" y2="296" stroke="#0969da" stroke-width="22" stroke-linecap="round" />
    <rect x="206" y="348" width="226" height="44" rx="14" fill="#dcfce7" />
    <line x1="224" y1="370" x2="404" y2="370" stroke="#1a7f37" stroke-width="18" stroke-linecap="round" />
    <line x1="214" y1="436" x2="384" y2="436" stroke="#0969da" stroke-width="20" stroke-linecap="round" />
    <rect x="206" y="484" width="226" height="44" rx="14" fill="#fee2e2" />
    <line x1="224" y1="506" x2="394" y2="506" stroke="#cf222e" stroke-width="18" stroke-linecap="round" />
    <line x1="214" y1="572" x2="354" y2="572" stroke="#64748b" stroke-width="18" stroke-linecap="round" stroke-opacity="0.55" />
    <line x1="214" y1="628" x2="394" y2="628" stroke="#0969da" stroke-width="20" stroke-linecap="round" />
    <line x1="214" y1="684" x2="334" y2="684" stroke="#64748b" stroke-width="18" stroke-linecap="round" stroke-opacity="0.55" />
  </g>

  <!-- Right Comparison Document Pane (Indigo) -->
  <g id="rightPane">
    <rect x="550" y="204" width="310" height="616" rx="42"
          fill="url(#rightGrad)" stroke="#4f46e5" stroke-width="18" />
    <line x1="600" y1="296" x2="750" y2="296" stroke="#4f46e5" stroke-width="22" stroke-linecap="round" />
    <rect x="592" y="348" width="226" height="44" rx="14" fill="#dcfce7" />
    <line x1="610" y1="370" x2="790" y2="370" stroke="#1a7f37" stroke-width="18" stroke-linecap="round" />
    <line x1="600" y1="436" x2="770" y2="436" stroke="#4f46e5" stroke-width="20" stroke-linecap="round" />
    <rect x="592" y="484" width="226" height="44" rx="14" fill="#e0f2fe" />
    <line x1="610" y1="506" x2="778" y2="506" stroke="#0284c7" stroke-width="18" stroke-linecap="round" />
    <line x1="600" y1="572" x2="740" y2="572" stroke="#64748b" stroke-width="18" stroke-linecap="round" stroke-opacity="0.55" />
    <line x1="600" y1="628" x2="780" y2="628" stroke="#4f46e5" stroke-width="20" stroke-linecap="round" />
    <line x1="600" y1="684" x2="720" y2="684" stroke="#64748b" stroke-width="18" stroke-linecap="round" stroke-opacity="0.55" />
  </g>

  <!-- Central Bidirectional Compare Emblem -->
  <g id="centerBadge" filter="url(#badgeShadow)">
    <circle cx="512" cy="512" r="122" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="12" />
    <path d="M442 512 H582" stroke="#ffffff" stroke-width="28" stroke-linecap="round" />
    <polyline points="478,468 434,512 478,556" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="546,468 590,512 546,556" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
