[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diff-and-compare-tool"
version = "1.0.0"
description = "Next-Gen Multi-Format Diff, 3-Way Merge & Synchronization Desktop Suite"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "vikrantblu" }
]
requires-python = ">=3.10"
keywords = ["diff", "merge", "compare", "gui", "pyside6", "tree-sitter", "windows"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control",
    "Topic :: Utilities"
]
dependencies = [
    "PySide6>=6.6.0",
    "pyqtdarktheme>=2.1.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0",
    "openpyxl>=3.1.0",
    "diff-match-patch>=20230430",
    "paramiko>=3.4.0",
    "blake3>=0.3.3",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.20.0",
    "tree-sitter-javascript>=0.20.0",
    "pyarrow>=14.0.0",
    "pymupdf>=1.23.0",
    "jsonpath-ng>=1.5.3"
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.3.0"
]
dev = [
    "pytest>=7.0.0"
]

[project.urls]
Homepage = "https://github.com/vikrantblu/diff_and_compare_tool"
Repository = "https://github.com/vikrantblu/diff_and_compare_tool"
Issues = "https://github.com/vikrantblu/diff_and_compare_tool/issues"

[project.scripts]
diff-and-compare = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "docs*", "windows*"]
