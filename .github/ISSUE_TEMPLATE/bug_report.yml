name: Bug Report
description: Report an issue or bug in diff_and_compare_tool
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please check existing issues and discussions before filing.
  - type: dropdown
    id: affected_studio
    attributes:
      label: Affected Studio / Component
      description: Which part of the application is failing?
      options:
        - 2-Way Text / Code Diff
        - 3-Way Merge Studio
        - Folder & Archive Comparison / Sync Hub
        - Visual Media & PDF Diff
        - Tabular / Spreadsheet Diff (Excel/Parquet/CSV)
        - Hex / Binary Diff
        - Structured Data Diff (JSON/YAML/XML)
        - Windows Shell Integration & Installer
        - General UI / Theme / Settings
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem clearly...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Open Studio '...'
        2. Load files '...'
        3. Click '...'
        4. See error or unexpected output
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen instead.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version, Python version, and execution mode (Standalone EXE vs Source).
      placeholder: e.g. Windows 11 23H2 / Standalone Installer x64 / Python 3.11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console Output / Error Traceback
      description: Paste any error messages, terminal logs, or stack traces here.
      render: shell
